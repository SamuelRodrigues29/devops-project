version: '3.71'

services:
  mysql:  
    image: mysql:8
    container_name: mysql
    volumes:
      - db:/var/lib/mysql 
    ports:
      - 3306:3306
    environment:
      - name=value  
      - MYSQL_ROOT_PASSWORD=root 
      - MYSQL_DATABASE=rockeseat-db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=root
    networks:
      - primeira-network  
  api-rocket: 
    build:
     # O conteudo da chave context é o ponto porque o arquivo se encontra no mesmo diretorio do dockerfile. poderia ser dockerfile também.
      context: .
    container_name: api-rocket
    ports:
      - 3001:3000
    depends_on: 
      - mysql
    networks:
      - primeira-network    
networks:
  primeira-network:
    name: primeira-network
    external: true
    driver: bridge

volumes:
  db:     