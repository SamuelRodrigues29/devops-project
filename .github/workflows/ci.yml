# Nome que aparecerá no GitHub Actions
name: CI

# Define quais eventos disparam a pipeline
on:
  # Executa quando houver um push
  push:
    # Apenas para a branch main
    branches:
      - master

permissions: 
  id-token: write
  contents: read       

# Lista de jobs da pipeline
jobs:

  # Identificador do job
  build:

    # Nome exibido na interface do GitHub Actions
    name: "Build and Push"

    # Runner (máquina virtual) onde o job será executado
    runs-on: ubuntu-latest    

    # Sequência de etapas do job
    steps:

    # Faz checkout do código do repositório
    - uses: actions/checkout@v4

    # Nome amigável da etapa
    - name: Setup node

      # Action oficial para instalar o Node.js
      uses: actions/setup-node@v4

      # Configurações da action
      with:

        # Utiliza a versão do Node definida na matriz
        node-version: 24
        # Habilita cache das dependências do Yarn
        cache: 'yarn'

    - run: yarn
    - run: yarn run test   

    # Instala as dependências do projeto
    - name: Install dependencies
      working-directory: api
      run: yarn  

    # Executa os testes automatizados
    - name: Run tests
      working-directory: api
      run: yarn test  

    - name: Generate tag
      id: generate_tag
      run: | 
       SHA=$(echo $GITHUB_SHA | head -c7)
       echo "sha=$SHA" >> $GITHUB_OUTPUT  

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:        
        role-to-assume: 'arn:aws:iam::403429280851:role/ecr-role'
        aws-region: us-east-2

    - name: Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build docker image 
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        TAG: ${{ steps.generate_tag.outputs.sha }}
      run: |
       docker build -t $REGISTRY/devops-project:$TAG .
       docker push $REGISTRY/devops-project:$TAG 